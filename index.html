<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EBCI / EBLG – Météo, vols, sonomètres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">
</head>
  
<body>
<header>
  <h1>EBCI / EBLG – Météo, vols, sonomètres</h1>
  <div class="small">
    AVWX + AirLabs • Analyse bruit • SID/STAR
  </div>
</header>
<main>
  <section id="sidebar">
    <!-- FILTRES -->
    <div class="block">
      <h2>Filtres</h2>
      <div class="filters">
       <div class="cockpit-toolbar">
  <label class="cockpit-switch">
    <input type="checkbox" id="filter-ebci" checked>
    <span>EBCI</span>
  </label>
  <label class="cockpit-switch">
    <input type="checkbox" id="filter-eblg" checked>
    <span>EBLG</span>
  </label>
  <button id="btn-reset-zoom" class="cockpit-button">
    🗺️ Recentrer
  </button>
</div>
      </div>
    </div>
    
    <!-- METEO -->
<div class="block">
  <h2>Météo</h2>
  <div class="wind-card">
    <h3>EBCI</h3>
    <div class="wind-rose">
  <div id="wind-arrow-ebci" class="wind-arrow">▲</div>
  <div id="wind-gust-arrow-ebci" class="wind-gust-arrow"></div>

  <div id="wind-avg-tag-ebci" class="wind-avg-tag"></div>
  <div id="wind-gust-tag-ebci" class="wind-gust-tag"></div>
</div>

    <div id="wind-info-ebci" class="small">
      Vent : ---
    </div>
    <div id="meteo-details-ebci" class="small"></div>
    <div id="meteo-ebci-summary" style="display:none"></div>
    <div id="meteo-ebci-raw" style="display:none"></div>
  </div>
  <div class="wind-card">
    <h3>EBLG</h3>
    <div class="wind-rose">
  <div id="wind-arrow-eblg" class="wind-arrow">▲</div>
  <div id="wind-gust-arrow-eblg" class="wind-gust-arrow"></div>

  <div id="wind-avg-tag-eblg" class="wind-avg-tag"></div>
  <div id="wind-gust-tag-eblg" class="wind-gust-tag"></div>
</div>

    <div id="wind-info-eblg" class="small">
      Vent : ---
    </div>
    <div id="meteo-details-eblg" class="small"></div>
    <div id="meteo-eblg-summary" style="display:none"></div>
    <div id="meteo-eblg-raw" style="display:none"></div>
  </div>
</div>
    
    <!-- PISTES -->
    <div class="block">
      <h2>Pistes</h2>
      <div id="runway-ebci" class="small"></div>
      <div class="mt-035">
        <div id="runway-eblg" class="small"></div>
      </div>
    </div>
    <!-- SONOMETRES -->
   <div class="legend">
  <span>
    <span class="dot dot-airport"></span>
    Aéroport
  </span>
  <span>
    <span class="dot dot-normal"></span>
    Sonomètre
  </span>
  <span>
    <span class="dot dot-impacted"></span>
    Sonomètre impacté
  </span>
</div>
      <div class="block">
  <h2>Sonomètres impactés</h2>
  <strong>EBCI</strong>
  <div id="list-ebci" class="small">
    En attente...
  </div>
  <div class="mt-035">
    <strong>EBLG</strong>
    <div id="list-eblg" class="small">
      En attente...
    </div>
  </div>
</div>
    <!-- VOLS -->
    <div class="block">
      <h2>Vols confirmés</h2>
      <div id="flights-ebci" class="small"></div>
      <div class="mt-035">
        <div id="flights-eblg" class="small"></div>
      </div>
    </div>
    
    <!-- VOL -->
    <div class="block">
      <h2>Vol sélectionné</h2>
      <div id="selected-flight-info"
           class="small">
      </div>
      <div id="selected-flight-sonos"
           class="small mt-035">
      </div>
    </div>
  </section>
  <section id="map"></section>
</main>
<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- chargement app.js -->
<script src="app.js"></script>
</body>
</html>
