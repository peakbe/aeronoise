<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>EBCI / EBLG – Météo, vols, sonomètres</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>EBCI / EBLG – Météo, vols, sonomètres</h1>

  <div class="small">
    AVWX + AirLabs • Analyse bruit • SID/STAR • Timeline
  </div>
</header>

<main>

  <section id="sidebar">

    <!-- FILTRES -->
    <div class="block">

      <h2>Filtres</h2>

      <div class="filters">

        <label>
          <input type="checkbox"
                 id="filter-ebci"
                 checked>
          Afficher EBCI
        </label>

        <label>
          <input type="checkbox"
                 id="filter-eblg"
                 checked>
          Afficher EBLG
        </label>

                <button id="btn-reset-zoom">
          🗺️ Recentrer la carte
        </button>

      </div>

    </div>

    <!-- METEO -->

    <div class="block">

      <h2>Météo</h2>

      <strong>EBCI</strong>
      <div id="meteo-ebci-summary" class="small"></div>
      <div id="meteo-ebci-raw" class="metar"></div>

      <div class="mt-05">
        <strong>EBLG</strong>
        <div id="meteo-eblg-summary" class="small"></div>
        <div id="meteo-eblg-raw" class="metar"></div>
      </div>

    </div>

    <!-- PISTES -->

    <div class="block">

      <h2>Pistes</h2>

      <div id="runway-ebci" class="small"></div>

      <div class="mt-035">
        <div id="runway-eblg" class="small"></div>
      </div>

    </div>

    <!-- SONOMETRES -->

    <div class="block">

      <h2>Sonomètres impactés</h2>

      <div id="list-ebci" class="small"></div>

      <div class="mt-035">
        <div id="list-eblg" class="small"></div>
      </div>

    </div>

    <!-- VOLS -->

    <div class="block">

      <h2>Vols confirmés</h2>

      <div id="flights-ebci" class="small"></div>

      <div class="mt-035">
        <div id="flights-eblg" class="small"></div>
      </div>

    </div>

    <!-- TIMELINE -->

    <div class="block">

      <h2>Timeline</h2>

      <input
        id="timeline-range"
        type="range"
        min="0"
        max="1440"
        value="0"
        step="1"
        class="w-100"
      >

      <div id="timeline-label" class="small">
        00:00
      </div>

      <button id="timeline-play">▶ Lecture</button>
      <button id="timeline-pause">⏸ Pause</button>

    </div>

    <!-- VOL -->

    <div class="block">

      <h2>Vol sélectionné</h2>

      <div id="selected-flight-info"
           class="small">
      </div>

      <div id="selected-flight-sonos"
           class="small mt-035">
      </div>

    </div>

  </section>

  <section id="map"></section>

</main>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="app.js"></script>

</body>
</html>
